[package]
name = "mewsik"
version = "0.4.3"
description = "Personal music streaming & discovery app"
authors = ["Remington Wilcox"]
license = "MIT"
edition = "2021"
rust-version = "1.88"

[lib]
name = "mewsik_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "=2.7.3"
tauri-plugin-deep-link = "=2.6.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["backup", "bundled", "vtab"] }
symphonia = { version = "0.5", features = ["all"] }
rodio = { version = "0.19", default-features = false, features = ["symphonia-all"] }
cpal = "0.15"
lofty = "0.21"
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }
ulid = "1.1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
ebur128 = "0.1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
walkdir = "2"
directories = "5"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
fuzzy-matcher = "0.3"
async-trait = "0.1"
urlencoding = "2"
realfft = "3"
quick-xml = "0.41"
dunce = "1"
base64 = "0.22"
# Evaluates YouTube player snippets for the in-app providers (see
# sources/web_providers.rs); the web view may not `eval`.
boa_engine = { version = "0.22", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

# Desktop-only deps. tray-icon pulls in desktop-only crates, and the
# process and updater plugins have no mobile implementation.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
tauri = { version = "2.11", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-process = "=2.4.0"
tauri-plugin-updater = "=2.14.1"
# Forwards a mewsik:// link to the running app instead of starting a second one.
tauri-plugin-single-instance = { version = "=2.5.5", features = ["deep-link"] }

[dev-dependencies]
minisign-verify = "=0.2.5"

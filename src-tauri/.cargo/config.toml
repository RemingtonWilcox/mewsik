# Force iOS deployment target to 17.0 for Tauri's swift-rs builds. Xcode 26
# no longer ships Swift back-deployment compat libraries (swiftCompatibility56,
# swiftCompatibilityConcurrency), so the Swift code Tauri compiles must target
# iOS 15+ to avoid them. Without `force`, cargo's [env] won't override the
# IPHONEOS_DEPLOYMENT_TARGET that Xcode's script phase passes in.
[env]
IPHONEOS_DEPLOYMENT_TARGET = { value = "17.0", force = true }

# Allow undefined symbols in the iOS cdylib link. Mewsik's iOS-only Swift
# integration (NowPlaying.swift) defines C-ABI functions called from Rust;
# those symbols only resolve at Xcode's final link step, not during cargo's
# intermediate cdylib link. Without this, cargo errors with
# "Undefined symbols: _mewsik_now_playing_setup".
[target.aarch64-apple-ios-sim]
rustflags = ["-C", "link-arg=-Wl,-undefined,dynamic_lookup"]

[target.aarch64-apple-ios]
rustflags = ["-C", "link-arg=-Wl,-undefined,dynamic_lookup"]

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open in mewsik</title>
<meta name="description" content="Someone shared a radio station or playlist with you in mewsik, the free open-source music player.">
<meta property="og:title" content="Listen in mewsik">
<meta property="og:description" content="A radio station or playlist was shared with you. Open it in mewsik, the free music player for Windows, Mac and iPhone.">
<meta property="og:image" content="https://raw.githubusercontent.com/RemingtonWilcox/mewsik/main/docs/visualizers.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="referrer" content="no-referrer">
<style>
  :root { --bg:#0b0b0b; --card:#151515; --line:#262626; --text:#f2f2f2; --muted:#9a9a9a; --accent:#4ade80; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; padding:24px 16px; }
  main { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:28px 24px; text-align:center; }
  .logo { width:64px; height:64px; border-radius:16px; }
  .kind { margin:18px 0 2px; color:var(--accent); font-size:12px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; }
  h1 { margin:0; font-size:24px; line-height:1.25; overflow-wrap:anywhere; }
  .sub { margin:6px 0 0; color:var(--muted); font-size:14px; }
  ol { text-align:left; margin:16px 0 0; padding:0 0 0 22px; color:var(--muted); font-size:14px; max-height:180px; overflow:auto; }
  .open { display:block; margin:24px 0 0; padding:14px; border-radius:999px; background:var(--accent); color:#04120a; font-weight:700; text-decoration:none; }
  .get { margin:22px 0 0; padding-top:18px; border-top:1px solid var(--line); color:var(--muted); font-size:14px; }
  .get a { color:var(--text); }
  .row { display:flex; gap:10px; justify-content:center; margin-top:10px; flex-wrap:wrap; }
  .row a { padding:8px 14px; border:1px solid var(--line); border-radius:999px; text-decoration:none; font-size:14px; }
  .bad { color:var(--muted); }
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.svg" alt="mewsik">
  <p class="kind" id="kind">mewsik</p>
  <h1 id="title">Open in mewsik</h1>
  <p class="sub" id="sub"></p>
  <ol id="tracks" hidden></ol>
  <a class="open" id="open" href="#">Open in mewsik</a>
  <div class="get">
    Don't have mewsik yet? It's free.
    <div class="row">
      <a href="https://github.com/RemingtonWilcox/mewsik/releases/latest">Windows &amp; Mac</a>
      <a href="https://testflight.apple.com/join/5GCnVzzR">iPhone</a>
    </div>
  </div>
</main>
<script>
// The share data lives in the #fragment, which the browser never sends to
// this server. This page only reads it to show what was shared and to hand
// the same data to the app as mewsik://<kind>/<data>.
(function () {
  var params = new URLSearchParams(location.hash.slice(1));
  var station = params.get('station');
  var playlist = params.get('playlist');
  var $ = function (id) { return document.getElementById(id); };
  var appUrl = null;

  if (station && /^[0-9a-f-]{36}$/i.test(station)) {
    appUrl = 'mewsik://station/' + station.toLowerCase();
    $('kind').textContent = 'Radio station';
    $('title').textContent = params.get('name') || 'A radio station';
    $('sub').textContent = params.get('where') || 'Live radio';
  } else if (playlist) {
    appUrl = 'mewsik://playlist/' + playlist;
    $('kind').textContent = 'Playlist';
    decodePlaylist(playlist).then(function (p) {
      $('title').textContent = p.n || 'A playlist';
      $('sub').textContent = p.t.length + (p.t.length === 1 ? ' song' : ' songs');
      var list = $('tracks');
      p.t.slice(0, 50).forEach(function (t) {
        var li = document.createElement('li');
        li.textContent = (t.a ? t.a + ' – ' : '') + t.t;
        list.appendChild(li);
      });
      list.hidden = false;
    }).catch(function () {
      $('title').textContent = 'A playlist';
    });
  } else {
    $('title').textContent = 'This link looks incomplete';
    $('sub').textContent = 'Ask for the link again, or get mewsik below.';
    $('open').hidden = true;
  }

  if (appUrl) {
    $('open').href = appUrl;
    // Try the app right away; the button stays for browsers that block it.
    setTimeout(function () { location.href = appUrl; }, 150);
  }

  // Same format the app writes: base64url of deflate-raw JSON
  // { v: 1, n: name, t: [{ t: title, a: artist, ... }] }.
  function decodePlaylist(data) {
    var b64 = data.replace(/-/g, '+').replace(/_/g, '/');
    var bin = atob(b64 + '==='.slice((b64.length + 3) % 4));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Response(stream).json();
  }
})();
</script>
</body>
</html>
